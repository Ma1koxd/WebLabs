<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Гномья сортировка</title>
    <link rel="stylesheet" href="look.css">
    <script src="logic.js"></script>
</head>
<body>
    <div class="card">
        <h1>Лабораторная работа №1</h1>

        <h3>Вариант №8</h3>

        <h2>Гномья сортировка</h2>

        <p class="description">
            Введите числа через пробел и нажмите кнопку.
        </p>

        <form>

            <input
                type="text"
                id="arrayInput"
                value=""
                placeholder="Например: 5 2 9 1 3"
            >

            <button type="button" onclick="sortArray();">
                Отсортировать
            </button>
        </form>

        <p id="result">Здесь появится результат.</p>
    </div>
</body>
</html>
